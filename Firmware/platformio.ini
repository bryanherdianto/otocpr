; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1

; ---------------------------------------------------------------------------
; 1. Default ESP32 Firmware + NEO-6M GPS over UART2 (RX2=GPIO16, TX2=GPIO17)
;    Used by BOTH real hardware AND the Wokwi simulation (see wokwi.toml).
; ---------------------------------------------------------------------------
[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  bogde/HX711@^0.7.5
  mikalhart/TinyGPSPlus@^1.1.0

; ---------------------------------------------------------------------------
; 2. PlatformIO In-Firmware NEO-6M Simulation (no physical GPS module needed)
;    Streams emulated NEO-6M NMEA sentences ($GPRMC/$GPGGA/$GPGSA/$GPGSV/...)
;    at 9600-baud pacing directly into TinyGPSPlus on the ESP32.
; ---------------------------------------------------------------------------
[env:esp32doit-devkit-v1-gps-sim]
extends = env:esp32doit-devkit-v1
build_flags =
  -DENABLE_GPS=1
  -DGPS_USE_EMULATOR=1
  -DGPS_SIM_LAT=-6.2088
  -DGPS_SIM_LON=106.8456
  -DGPS_SIM_SPEED_KMH=18.0
  -DGPS_SIM_COURSE_DEG=25.9
  -DGPS_SIM_SATS=8

; ---------------------------------------------------------------------------
; 3. Original Firmware Mode (GPS disabled, exact original CSV & LCD layout)
; ---------------------------------------------------------------------------
[env:esp32doit-devkit-v1-legacy]
extends = env:esp32doit-devkit-v1
build_flags =
  -DENABLE_GPS=0

; ---------------------------------------------------------------------------
; 4. Desktop Host NMEA Simulation / Unit Tests (`pio test -e native`)
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_build_src = no
build_flags =
  -std=c99
  -Wall
  -Wextra
